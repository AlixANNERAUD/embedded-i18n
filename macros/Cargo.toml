[package]
name = "embedded-i18n-macros"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Internal implementation detail of embedded-i18n. Not meant for direct use; depend on embedded-i18n instead."

[dependencies]
syn = "2.0"
quote = "1.0"
proc-macro2 = "1.0"
serde_json = { version = "1.0", optional = true }
yaml-rust2 = { version = "0.13", optional = true }
toml = { version = "1", optional = true, default-features = false, features = ["parse", "serde", "std"] }
fluent-syntax = { version = "0.12", optional = true }

[dev-dependencies]
tempfile = "3"

[features]
default = ["backend-json"]
backend-json = ["dep:serde_json"]
backend-po = []
backend-mo = []
backend-yaml = ["dep:yaml-rust2"]
backend-toml = ["dep:toml"]
backend-fluent = ["dep:fluent-syntax"]

[lib]
proc-macro = true
