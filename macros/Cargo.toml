[package]
name = "embedded-i18n-macros"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Internal implementation detail of embedded-i18n. Not meant for direct use; depend on embedded-i18n instead."

[dependencies]
syn = "2.0"
quote = "1.0"
proc-macro2 = "1.0"
serde_json = { version = "1.0", optional = true }

[dev-dependencies]
tempfile = "3"

[features]
default = ["backend-json"]
backend-json = ["dep:serde_json"]
backend-po = []

[lib]
proc-macro = true
