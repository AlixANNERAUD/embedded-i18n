name: Check

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5

      - uses: jdx/mr-boxington-action@v1
        with:
          cache-key-suffix: check
          github-cache-mode: objects

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Documentation
        run: cargo doc --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Test without alloc
        run: cargo test --workspace --no-default-features --features backend-json,backend-po

      - name: Test multiple locales
        run: |
          EMBEDDED_I18N_LOCALES=en,fr cargo test --test multi_locale
          EMBEDDED_I18N_LOCALES=en,fr cargo test --test multi_locale --no-default-features --features backend-po

      - name: Test and Coverage
        run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: AlixANNERAUD/embedded-i18n
          files: lcov.info
          fail_ci_if_error: true

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5

      - uses: jdx/mr-boxington-action@v1
        with:
          cache-key-suffix: package

      - name: Version consistency
        run: |
          metadata=$(cargo metadata --format-version 1 --no-deps)
          root=$(echo "$metadata" | jq -r '.packages[] | select(.name == "embedded-i18n") | .version')
          macros=$(echo "$metadata" | jq -r '.packages[] | select(.name == "embedded-i18n-macros") | .version')
          pin=$(echo "$metadata" | jq -r '.packages[] | select(.name == "embedded-i18n") | .dependencies[] | select(.name == "embedded-i18n-macros") | .req')
          echo "embedded-i18n=$root embedded-i18n-macros=$macros pin=$pin"
          test "$root" = "$macros"
          test "$pin" = "=$root"

      - name: Package
        run: cargo package --workspace

  no-std:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features: [backend-json, backend-po, "backend-json,alloc"]
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5

      - uses: jdx/mr-boxington-action@v1
        with:
          cache-key-suffix: no-std-${{ strategy.job-index }}

      - name: Build
        run: cargo build --target thumbv7em-none-eabihf --no-default-features --features ${{ matrix.features }}

  msrv:
    runs-on: ubuntu-latest
    env:
      MISE_ENV: msrv
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5

      - uses: jdx/mr-boxington-action@v1
        with:
          cache-key-suffix: msrv

      - name: Test
        run: cargo test --workspace --all-features --locked
