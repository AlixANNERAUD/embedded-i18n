[workspace]
members = ["macros"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/AlixANNERAUD/embedded-i18n"
authors = ["Alix ANNERAUD <alix@anneraud.fr>"]

[package]
name = "embedded-i18n"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Compile-time internationalization (i18n) for embedded and no_std systems — translate strings at build time from JSON or PO locale files and embed them directly into ROM."
keywords = ["i18n", "internationalization", "embedded", "no-std", "localization"]
categories = ["internationalization", "embedded", "no-std"]

[dependencies]
embedded-i18n-macros = { version = "=0.1.0", path = "./macros", default-features = false }

[features]
default = ["backend-json"]
std = []
backend-json = ["embedded-i18n-macros/backend-json"]
backend-po = ["embedded-i18n-macros/backend-po"]

[package.metadata.docs.rs]
features = ["std", "backend-json", "backend-po"]
