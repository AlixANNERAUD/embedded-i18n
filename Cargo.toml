[workspace]
members = ["macros"]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/AlixANNERAUD/embedded-i18n"
authors = ["Alix ANNERAUD <alix@anneraud.fr>"]

[package]
name = "embedded-i18n"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Compile-time i18n for embedded and no_std Rust: translations from JSON, YAML, TOML, gettext PO/MO or Fluent files compiled into ROM literals, with plurals, context, fallbacks and no allocator."
keywords = ["i18n", "localization", "translation", "embedded", "no-std"]
categories = ["internationalization", "localization", "embedded", "no-std", "no-std::no-alloc"]

[dependencies]
embedded-i18n-macros = { version = "=0.1.1", path = "./macros", default-features = false }

[features]
default = ["backend-json"]
alloc = []
std = ["alloc"]
backend-json = ["embedded-i18n-macros/backend-json"]
backend-po = ["embedded-i18n-macros/backend-po"]
backend-mo = ["embedded-i18n-macros/backend-mo"]
backend-yaml = ["embedded-i18n-macros/backend-yaml"]
backend-toml = ["embedded-i18n-macros/backend-toml"]
backend-fluent = ["embedded-i18n-macros/backend-fluent"]

[package.metadata.docs.rs]
all-features = true
